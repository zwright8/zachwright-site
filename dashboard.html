<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgenticCoding Operations Dashboard | Zach Wright</title>
    <meta name="description" content="Live telemetry for Zach Wright's AgenticCoding workflows across sales, delivery, and operations.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
    <link
        rel="icon"
        href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="32" fill="%230a0a0a"/><text x="50%25" y="54%25" dominant-baseline="middle" text-anchor="middle" fill="%23f5f5f5" font-family="serif" font-style="italic" font-size="24">ZW</text></svg>'
    />
    <style>
        :root {
            --bg: #050505;
            --surface: rgba(20, 20, 20, 0.72);
            --surface-quiet: rgba(255, 255, 255, 0.035);
            --surface-lifted: rgba(255, 255, 255, 0.065);
            --ink: hsl(0 0% 96%);
            --muted: hsl(0 0% 58%);
            --muted-strong: hsl(0 0% 72%);
            --line: rgba(255, 255, 255, 0.1);
            --line-strong: rgba(255, 255, 255, 0.16);
            --accent-a: #89aacc;
            --accent-b: #4e85bf;
            --danger: #e28a8a;
            --radius: 8px;
            --shadow: 0 22px 56px rgba(0, 0, 0, 0.34);
            --dur: 220ms;
            --font-sans: "Inter", sans-serif;
            --font-display: "Instrument Serif", serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            background: var(--bg);
        }

        body {
            position: relative;
            isolation: isolate;
            min-width: 320px;
            min-height: 100vh;
            font-family: var(--font-sans);
            color: var(--ink);
            background:
                linear-gradient(180deg, rgba(5, 5, 5, 0.42) 0%, rgba(5, 5, 5, 0.88) 68%, var(--bg) 100%),
                var(--bg);
            line-height: 1.5;
            text-rendering: geometricPrecision;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            position: fixed;
            inset: 0;
            pointer-events: none;
            content: "";
        }

        body::before {
            z-index: -4;
            background-image: url("/assets/hero-material-1800.webp");
            background-position: center top;
            background-size: cover;
            filter: saturate(0.96) contrast(1.03);
            opacity: 0.54;
        }

        body::after {
            z-index: -3;
            background:
                radial-gradient(circle at 50% 12%, rgba(78, 133, 191, 0.2), transparent 34%),
                radial-gradient(circle at 90% 0%, rgba(137, 170, 204, 0.12), transparent 32%),
                linear-gradient(180deg, rgba(5, 5, 5, 0.3) 0%, rgba(5, 5, 5, 0.82) 58%, var(--bg) 100%);
        }

        a {
            color: inherit;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        ::selection {
            background: rgba(137, 170, 204, 0.36);
            color: var(--ink);
        }

        a:focus-visible,
        #app:focus-visible {
            outline: 2px solid var(--ink);
            outline-offset: 3px;
        }

        .skip-link {
            position: fixed;
            top: -56px;
            left: 16px;
            z-index: 100;
            border-radius: 999px;
            background: var(--ink);
            color: var(--bg);
            font-size: 0.78rem;
            font-weight: 700;
            padding: 10px 14px;
            transition: top var(--dur) ease;
        }

        .skip-link:focus-visible {
            top: 16px;
        }

        .shell {
            width: min(1220px, 100% - 48px);
            margin: 0 auto;
            position: relative;
            z-index: 1;
            padding: 1px 0 48px;
        }

        .nav {
            position: sticky;
            top: 16px;
            z-index: 20;
            width: fit-content;
            max-width: calc(100vw - 32px);
            margin: 16px auto 0;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: rgba(20, 20, 20, 0.86);
            backdrop-filter: blur(18px) saturate(130%);
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.22);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px;
            transition: opacity var(--dur) ease, transform var(--dur) ease;
        }

        .nav.is-hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(calc(-100% - 32px));
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding-right: 10px;
            color: var(--ink);
            white-space: nowrap;
        }

        .brand-mark {
            display: grid;
            width: 36px;
            height: 36px;
            place-items: center;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
            transition: transform var(--dur) ease, background var(--dur) ease;
        }

        .brand:hover .brand-mark {
            transform: scale(1.06);
            background: linear-gradient(90deg, var(--accent-b), var(--accent-a));
        }

        .brand-initials {
            display: grid;
            width: 30px;
            height: 30px;
            place-items: center;
            border-radius: 999px;
            background: var(--bg);
            font-family: var(--font-display);
            font-size: 13px;
            font-style: italic;
            line-height: 1;
        }

        .brand-name {
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            transition: color var(--dur) ease;
        }

        .brand:hover .brand-name {
            color: var(--ink);
        }

        .nav-links {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border-left: 1px solid var(--line);
            border-right: 1px solid var(--line);
            padding-inline: 8px;
        }

        .nav-links a,
        .nav-cta,
        .hero-link {
            display: inline-flex;
            min-height: 34px;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 500;
            transition: background-color var(--dur) ease, border-color var(--dur) ease, color var(--dur) ease, transform var(--dur) ease;
            white-space: nowrap;
        }

        .nav-links a {
            color: var(--muted);
            padding: 0 14px;
        }

        .nav-links a:hover,
        .nav-links a[aria-current="page"] {
            background: rgba(255, 255, 255, 0.06);
            color: var(--ink);
        }

        .nav-cta {
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: var(--ink);
            color: var(--bg);
            padding: 0 16px;
        }

        .nav-cta:hover {
            transform: translateY(-1px);
            background: transparent;
            color: var(--ink);
            border-color: rgba(255, 255, 255, 0.24);
        }

        #app {
            margin-top: 24px;
        }

        .hero {
            overflow: hidden;
            border: 1px solid var(--line-strong);
            border-radius: var(--radius);
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0.025) 46%, rgba(78, 133, 191, 0.08) 100%),
                var(--surface);
            box-shadow: var(--shadow);
            backdrop-filter: blur(18px);
            padding: clamp(22px, 4vw, 42px);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 20px;
            align-items: end;
            margin-bottom: 10px;
        }

        .kicker {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--muted);
            margin-bottom: 10px;
        }

        .hero h1 {
            font-family: var(--font-display);
            max-width: 100%;
            font-size: 5.8rem;
            font-style: italic;
            font-weight: 400;
            line-height: 0.88;
            letter-spacing: 0;
            margin-bottom: 14px;
            color: var(--ink);
            overflow-wrap: normal;
        }

        .hero p {
            color: var(--muted-strong);
            font-size: 1.02rem;
            max-width: 620px;
        }

        .status {
            margin-top: 18px;
            display: inline-flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            border-radius: 999px;
            border: 1px solid rgba(137, 170, 204, 0.36);
            background: rgba(137, 170, 204, 0.1);
            color: #d6e3f1;
            font-family: var(--font-mono);
            font-size: 0.66rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 6px 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
            box-shadow: 0 0 0 0 rgba(137, 170, 204, 0.38);
            animation: pulse 2.4s ease-in-out infinite;
        }

        .hero-link {
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.045);
            color: var(--ink);
            padding: 0 14px;
        }

        .hero-link:hover {
            transform: translateY(-1px);
            border-color: var(--line-strong);
            background: rgba(255, 255, 255, 0.08);
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 8px;
            margin-bottom: 10px;
        }

        .kpi {
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--surface-quiet);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22);
            padding: 12px;
            backdrop-filter: blur(14px);
        }

        .kpi strong {
            display: block;
            font-size: 1.45rem;
            line-height: 1;
            margin-bottom: 8px;
            letter-spacing: 0;
            color: var(--ink);
        }

        .kpi span {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            color: var(--muted);
        }

        .layout {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .panel {
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: 0 18px 44px rgba(0, 0, 0, 0.25);
            padding: 14px;
            backdrop-filter: blur(18px);
        }

        .panel-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .panel-head h2 {
            font-size: 0.96rem;
            line-height: 1.2;
            font-weight: 600;
            letter-spacing: 0;
        }

        .panel-head .tag {
            font-family: var(--font-mono);
            font-size: 0.61rem;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            color: var(--muted);
            border: 1px solid var(--line);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.035);
            padding: 5px 8px;
            white-space: nowrap;
        }

        .feed {
            display: grid;
            gap: 7px;
        }

        .feed-item {
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--surface-quiet);
            padding: 10px;
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 10px;
            align-items: start;
        }

        .event-type {
            font-family: var(--font-mono);
            font-size: 0.59rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #d6e3f1;
            border: 1px solid rgba(137, 170, 204, 0.3);
            border-radius: 999px;
            background: rgba(137, 170, 204, 0.1);
            padding: 4px 6px;
            white-space: nowrap;
        }

        .feed-note {
            font-size: 0.83rem;
            margin-bottom: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .feed-meta {
            font-size: 0.72rem;
            color: var(--muted);
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        .stat {
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--surface-quiet);
            padding: 10px;
        }

        .stat strong {
            display: block;
            font-size: 1rem;
            line-height: 1.1;
            margin-bottom: 3px;
        }

        .stat strong.good { color: var(--accent-a); }
        .stat strong.bad { color: var(--danger); }

        .stat span {
            font-family: var(--font-mono);
            font-size: 0.58rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
        }

        .stage-grid {
            margin-top: 8px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(108px, 1fr));
            gap: 7px;
        }

        .stage {
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--surface-quiet);
            padding: 9px;
            text-align: center;
        }

        .stage strong {
            display: block;
            font-size: 0.97rem;
            line-height: 1.05;
            margin-bottom: 3px;
        }

        .stage span {
            font-family: var(--font-mono);
            font-size: 0.56rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
        }

        .skills {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
            gap: 7px;
        }

        .skill {
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--surface-quiet);
            padding: 12px;
        }

        .skill h3 {
            font-size: 0.9rem;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }

        .skill p {
            font-size: 0.78rem;
            color: var(--muted);
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .updates {
            display: grid;
            gap: 7px;
        }

        .update {
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--surface-quiet);
            min-height: 44px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            transition: transform var(--dur) ease, background-color var(--dur) ease, border-color var(--dur) ease;
        }

        .update:hover {
            transform: translateY(-1px);
            border-color: var(--line-strong);
            background: var(--surface-lifted);
        }

        .update .title {
            font-size: 0.82rem;
            font-weight: 600;
        }

        .update .date {
            font-family: var(--font-mono);
            font-size: 0.59rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            white-space: nowrap;
        }

        .empty {
            border: 1px dashed var(--line-strong);
            border-radius: var(--radius);
            background: var(--surface-quiet);
            color: var(--muted);
            text-align: center;
            font-size: 0.8rem;
            padding: 12px;
        }

        .loading {
            text-align: center;
            color: var(--muted);
            font-size: 0.92rem;
            padding: 78px 0;
        }

        .spinner {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.16);
            border-top-color: var(--accent-a);
            margin: 0 auto 11px;
            animation: spin 0.85s linear infinite;
        }

        footer {
            margin-top: 22px;
            border-top: 1px solid var(--line);
            padding-top: 14px;
            color: var(--muted);
            font-size: 0.77rem;
        }

        footer a {
            color: var(--ink);
            font-weight: 600;
        }

        footer a:hover {
            color: var(--accent-a);
        }

        .reveal {
            opacity: 0;
            transform: translateY(14px);
            animation: enter 0.6s cubic-bezier(0.2, 0.75, 0.25, 1) forwards;
        }

        #app > .reveal:nth-child(1) { animation-delay: 0.04s; }
        #app > .reveal:nth-child(2) { animation-delay: 0.1s; }
        #app > .reveal:nth-child(3) { animation-delay: 0.16s; }
        #app > .reveal:nth-child(4) { animation-delay: 0.22s; }
        #app > .reveal:nth-child(5) { animation-delay: 0.28s; }

        @keyframes enter {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(137, 170, 204, 0.38); }
            50% { box-shadow: 0 0 0 8px rgba(137, 170, 204, 0); }
        }

        @media (max-width: 1080px) {
            .hero h1 {
                font-size: 4.4rem;
            }

            .kpi-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .layout {
                grid-template-columns: 1fr;
            }

            .hero {
                grid-template-columns: 1fr;
            }

            .hero-link {
                width: fit-content;
            }
        }

        @media (max-width: 760px) {
            .shell {
                width: calc(100% - 32px);
            }

            .nav {
                width: 100%;
                max-width: 100%;
                border-radius: 18px;
                flex-wrap: wrap;
                justify-content: space-between;
            }

            .nav-links {
                width: 100%;
                order: 3;
                justify-content: center;
                border-top: 1px solid var(--line);
                border-left: 0;
                border-right: 0;
                padding: 8px 0 0;
            }

            .nav-cta {
                order: 4;
                width: calc(100% - 16px);
                margin-top: 8px;
                padding-inline: 14px;
            }

            .brand-name {
                display: none;
            }

            .hero,
            .panel {
                padding: 16px 13px;
            }

            .hero h1 {
                font-size: 2.28rem;
                line-height: 0.98;
                overflow-wrap: anywhere;
            }

            .hero p {
                font-size: 0.94rem;
            }

            .kpi-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .feed-note {
                white-space: normal;
            }

            .stat-grid,
            .skills {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 430px) {
            .hero h1 {
                font-size: 2.05rem;
            }

            .kicker,
            .status {
                font-size: 0.58rem;
                letter-spacing: 0.08em;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }

            .reveal {
                opacity: 1;
                transform: none;
            }
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#app">Skip to dashboard</a>
    <div class="shell">
        <nav class="nav" aria-label="Primary">
            <a class="brand" href="/" aria-label="Zach Wright home">
                <span class="brand-mark"><span class="brand-initials">ZW</span></span>
                <span class="brand-name">Zach Wright</span>
            </a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/dashboard.html" aria-current="page">Dashboard</a>
                <a href="/updates/2026-02-22.html">Updates</a>
            </div>
            <a class="nav-cta" href="https://cal.com/zachary-wright-l9sdgm/30min" target="_blank" rel="noopener noreferrer">Book Call</a>
        </nav>

        <main id="app" tabindex="-1">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading dashboard telemetry...</p>
            </div>
        </main>

        <footer>
            Built by Z on <a href="https://openclaw.com" target="_blank" rel="noopener noreferrer">OpenClaw</a>.
        </footer>
    </div>

    <script src="/assets/hide-nav-on-scroll.js"></script>
    <script>
    const TYPE_LABELS = { email: "Email", call: "Call", meeting: "Meeting", note: "Note" };
    const STAGE_LABELS = {
        "new": "New",
        "qualified": "Qualified",
        "proposal": "Proposal",
        "negotiation": "Negotiation",
        "closed-won": "Won",
        "closed-lost": "Lost"
    };
    const STAGE_ORDER = ["new", "qualified", "proposal", "negotiation", "closed-won", "closed-lost"];

    function esc(value) {
        if (value === null || value === undefined) return "";
        const el = document.createElement("span");
        el.textContent = String(value);
        return el.innerHTML;
    }

    function num(value) {
        return Number(value || 0).toLocaleString();
    }

    function money(value) {
        return "$" + Number(value || 0).toLocaleString();
    }

    function relativeTime(dateStr) {
        const now = Date.now();
        const then = new Date(dateStr).getTime();
        const diff = Math.max(0, now - then);
        const mins = Math.floor(diff / 60000);

        if (mins < 1) return "just now";
        if (mins < 60) return `${mins}m ago`;

        const hrs = Math.floor(mins / 60);
        if (hrs < 24) return `${hrs}h ago`;

        const days = Math.floor(hrs / 24);
        if (days === 1) return "yesterday";
        if (days < 30) return `${days}d ago`;

        return new Date(dateStr).toLocaleDateString();
    }

    function formatGeneratedAt(value) {
        if (!value) return "unknown";
        const d = new Date(value);
        if (Number.isNaN(d.getTime())) return "unknown";
        return d.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    }

    function sortStages(a, b) {
        const ai = STAGE_ORDER.indexOf(a[0]);
        const bi = STAGE_ORDER.indexOf(b[0]);
        return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
    }

    function render(data) {
        const app = document.getElementById("app");
        const uptime = data.uptime || {};
        const pipeline = data.pipeline || { byStage: {} };
        const outbound = data.outbound || {};
        const activities = Array.isArray(data.activities) ? data.activities : [];
        const skills = Array.isArray(data.skills) ? data.skills : [];
        const updates = Array.isArray(data.updates) ? data.updates : [];
        const stageEntries = Object.entries(pipeline.byStage || {}).sort(sortStages);

        app.innerHTML = `
            <section class="hero reveal">
                <div>
                    <p class="kicker">AgenticCoding Telemetry</p>
                    <h1>Operations Dashboard</h1>
                    <p>Live execution stream across activity, pipeline, and outbound performance.</p>
                    <div class="status">
                        <span class="status-dot"></span>
                        Agent online
                        <span>Updated ${esc(formatGeneratedAt(data.generatedAt))}</span>
                    </div>
                </div>
                <a class="hero-link" href="/">Back to home</a>
            </section>

            <section class="kpi-grid reveal">
                <article class="kpi"><strong>${num(uptime.daysAlive)}</strong><span>Days alive</span></article>
                <article class="kpi"><strong>${num(uptime.totalContacts)}</strong><span>CRM contacts</span></article>
                <article class="kpi"><strong>${num(uptime.totalActivities)}</strong><span>Activities logged</span></article>
                <article class="kpi"><strong>${num(outbound.signalsScanned)}</strong><span>Signals scanned</span></article>
                <article class="kpi"><strong>${num(uptime.skillsCount)}</strong><span>Skills built</span></article>
                <article class="kpi"><strong>${num(outbound.conversionRate)}%</strong><span>Lead conversion</span></article>
            </section>

            <section class="layout reveal">
                <article class="panel">
                    <div class="panel-head">
                        <h2>Recent Activity</h2>
                        <span class="tag">${num(activities.length)} events</span>
                    </div>
                    <div class="feed">
                        ${activities.length ? activities.map((item) => `
                            <div class="feed-item">
                                <div class="event-type">${esc(TYPE_LABELS[item.type] || "Event")}</div>
                                <div>
                                    <div class="feed-note">${esc(item.note) || "Untitled activity"}</div>
                                    <div class="feed-meta">${esc(item.contact) || "Unknown contact"} &middot; ${relativeTime(item.date)}</div>
                                </div>
                            </div>
                        `).join("") : `<div class="empty">No activity has been logged yet.</div>`}
                    </div>
                </article>

                <article class="panel">
                    <div class="panel-head">
                        <h2>Pipeline Snapshot</h2>
                        <span class="tag">Deals</span>
                    </div>
                    <div class="stat-grid">
                        <div class="stat"><strong>${num(pipeline.totalDeals)}</strong><span>Total deals</span></div>
                        <div class="stat"><strong>${money(pipeline.totalValue)}</strong><span>Pipeline value</span></div>
                        <div class="stat"><strong class="good">${num(pipeline.wins)}</strong><span>Wins</span></div>
                        <div class="stat"><strong class="bad">${num(pipeline.losses)}</strong><span>Losses</span></div>
                    </div>
                    <div class="stage-grid">
                        ${stageEntries.length ? stageEntries.map(([stage, count]) => `
                            <div class="stage">
                                <strong>${num(count)}</strong>
                                <span>${esc(STAGE_LABELS[stage] || stage)}</span>
                            </div>
                        `).join("") : `<div class="empty">No stage distribution available.</div>`}
                    </div>
                </article>
            </section>

            <section class="panel reveal">
                <div class="panel-head">
                    <h2>Outbound Sales</h2>
                    <span class="tag">Performance</span>
                </div>
                <div class="kpi-grid" style="margin-bottom:0;">
                    <article class="kpi"><strong>${num(outbound.signalsScanned)}</strong><span>Signals scanned</span></article>
                    <article class="kpi"><strong>${num(outbound.leadsTotal)}</strong><span>Leads found</span></article>
                    <article class="kpi"><strong>${num(outbound.leadsQualified)}</strong><span>Leads qualified</span></article>
                    <article class="kpi"><strong>${num(outbound.leadsContacted)}</strong><span>Leads contacted</span></article>
                </div>
            </section>

            <section class="panel reveal">
                <div class="panel-head">
                    <h2>Skills Built</h2>
                    <span class="tag">${num(skills.length)} skills</span>
                </div>
                <div class="skills">
                    ${skills.length ? skills.map((skill) => `
                        <article class="skill">
                            <h3>${esc(skill.name) || "Untitled skill"}</h3>
                            <p>${esc(skill.description) || "No description available."}</p>
                        </article>
                    `).join("") : `<div class="empty">No skills found.</div>`}
                </div>
            </section>

            ${updates.length ? `
            <section class="panel reveal">
                <div class="panel-head">
                    <h2>Weekly Updates</h2>
                    <span class="tag">${num(updates.length)} posts</span>
                </div>
                <div class="updates">
                    ${updates.map((update) => `
                        <a class="update" href="/updates/${update.slug}.html">
                            <span class="title">${esc(update.title) || "Untitled update"}</span>
                            <span class="date">${esc(update.date)}</span>
                        </a>
                    `).join("")}
                </div>
            </section>
            ` : ""}
        `;
    }

    fetch("dashboard-data.json")
        .then((response) => {
            if (!response.ok) throw new Error(String(response.status));
            return response.json();
        })
        .then(render)
        .catch(() => {
            document.getElementById("app").innerHTML = `
                <div class="loading">
                    <p>Dashboard telemetry is currently unavailable. Try refreshing.</p>
                </div>
            `;
        });
    </script>
</body>
</html>
