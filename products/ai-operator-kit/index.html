      --accent: #9ee4ba;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      display: grid;
      place-items: center;

    }

    body::before,
    body::after {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      content: "";
    }

    body::before {
      background-image: url("/assets/hero-material-1800.webp");
      background-position: center top;
      background-size: cover;
      filter: saturate(0.96) contrast(1.03);
      opacity: 0.52;

    body::after {
      z-index: -1;
      background: linear-gradient(180deg, rgba(5, 5, 5, 0.42) 0%, rgba(5, 5, 5, 0.82) 100%);
    }

    main {
      position: relative;
      z-index: 1;
      width: min(640px, 100%);
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(11, 18, 29, 0.9) 0%, rgba(13, 21, 33, 0.94) 100%);
      padding: 1.4rem;
      text-align: left;
    }

      line-height: 1.08;
      margin-bottom: 0.56rem;
      text-transform: uppercase;
      letter-spacing: -0.01em;
    }

    p {
      color: var(--muted);
      margin-bottom: 0.8rem;
      font-size: 0.98rem;
      line-height: 1.5;
    }

    a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
  </style>
</head>
